<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGEPI</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3c98bd">
  <link rel="apple-touch-icon" href="imagens/icone-192.png">
  <!-- PWA -->
   
  <!-- Os Termos são a PRIMEIRA tela: redireciona para o aceite antes de qualquer coisa -->
  <meta http-equiv="refresh" content="0; url=paginas/termos.html">
  <script>
    // Se o usuário já aceitou esta versão dos termos, vai direto para o login
    const VERSAO_TERMOS = '1.0';
    let jaAceitou = false;
    try {
      const registro = JSON.parse(localStorage.getItem('termosAceitos'));
      jaAceitou = registro && registro.versao === VERSAO_TERMOS;
    } catch (e) {
      jaAceitou = false;
    }
    window.location.replace(jaAceitou ? 'paginas/loginpage.html' : 'paginas/termos.html');
  </script>
</head>
<body>
  <p>Redirecionando para os Termos de Uso… <a href="paginas/termos.html">clique aqui</a> se não for automático.</p>
</body>
</html>
