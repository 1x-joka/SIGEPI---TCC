<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — SIGEPI</title>
  <link rel="stylesheet" href="../estilos/style.css">
  <link rel="shortcut icon" href="../icons/favicon-capacete.png" type="image/png">
   
  <!-- PWA -->
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#3c98bd">
  <link rel="apple-touch-icon" href="../imagens/icone-192.png">
  <!-- PWA -->

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="../scripts/script.js" defer></script>
</head>
<body class="layout-flex">
  <header class="header">
    <div class="logo-wrap">
      <span class="logo-title"><a href="home.html">SIGEPI</a></span>
      <span class="logo-sub"><a href="home.html">Gerenciador de EPI Online</a></span>
    </div>
    <a href="loginpage.html" class="header-link">Login</a>
  </header>

  <div class="page-center signup-scroll-fix">
    <div class="signup-card">
      <h1>Sign Up</h1>
      <div class="form-group form-group--login">
        <label for="nome">Nome Completo <span class="req">*</span></label>
        <input type="text" placeholder="Digite seu nome completo" id="nome">
        <span class="error-msg" id="nome-error">Campo obrigatório.</span>
      </div>
      <div class="form-group form-group--login">
        <label for="email">Email <span class="req">*</span></label>
        <input type="email" placeholder="Exemplo@gmail.com" id="email">
        <span class="error-msg" id="email-error">E-mail inválido.</span>
      </div>
      <div class="form-group form-group--login">
        <label for="senha">Senha <span class="req">*</span></label>
        <div class="senha-wrap">
          <input type="password" placeholder="Digite sua senha (min 8 dígitos)" id="senha">
          <button type="button" class="btn-olho" onclick="toggleSenha('senha', this)" aria-label="Mostrar senha">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
        <span class="error-msg" id="senha-error">Mínimo 8 caracteres.</span>
      </div>
      <div class="form-group form-group--login">
        <label for="cpf">CPF <span class="req">*</span></label>
        <input type="text" placeholder="XXX.XXX.XXX-XX" id="cpf" maxlength="14">
        <span class="error-msg" id="cpf-error">CPF inválido.</span>
      </div>
      <div class="form-group form-group--login">
        <label for="tipo">Tipo de conta <span class="req">*</span></label>
        <div class="select-wrap">
          <select id="tipo">
            <option value="">Selecione</option>
            <option value="1">Administrador</option>
            <option value="2">Funcionário</option>
          </select>
        </div>
        <span class="error-msg" id="tipo-error">Selecione o tipo de conta.</span>
      </div>
      <button class="btn btn-primary btn-entrar" onclick="cadastrar()">Cadastrar</button>
    </div>
  </div>
</body>
</html>
