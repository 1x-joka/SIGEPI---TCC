<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — SIGEPI</title>
  <link rel="stylesheet" href="../estilos/style.css">
  <link rel="shortcut icon" href="../icons/favicon-capacete.png" type="image/png">
   
  <!-- PWA -->
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#3c98bd">
  <link rel="apple-touch-icon" href="../imagens/icone-192.png">
  <!-- PWA -->

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="../scripts/script.js" defer></script>
</head>
<body class="layout-flex" data-protegida>
  <header class="header">
    <div class="logo-wrap">
      <span class="logo-title">SIGEPI</span>
      <span class="logo-sub">Gerenciador de EPI Online</span>
    </div>
    <div class="header-right">
      Administrador
      <div class="avatar-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      </div>
      <div class="dropdown-menu">
        <a href="secao-empresa.html">🏢 Empresa</a>
        <a href="secao-setores.html">🏗️ Setores</a>
      </div>
    </div>
  </header>

  <div class="main-area">
    <div class="content-card">
      <nav class="inner-nav">
        <a href="dashboard.html" class="active">Dashboard</a>
        <a href="epis.html">EPIs</a>
        <a href="funcionarios.html">Funcionários</a>
        <a href="historico.html">Histórico</a>
      </nav>
      <div class="dashboard-body">
        <div class="kpi-card">
          <div class="label">EPIs Entregues (em )</div>
          <div class="value">0</div>
        </div>
        <div class="tabela-compra">
          <h3>EPIs com necessidade de compra</h3>
          <table>
            <thead><tr><th>EPI</th><th>CA</th><th>Qtd suger</th></tr></thead>
            <tbody>
            </tbody>
          </table>
        </div>
        <div class="status-ca">
          <h3>Status de CA</h3>
          <div class="status-item">
            <span class="s-label">VÁLIDO</span>
            <span class="s-val s-val--verde">✅ 0</span>
          </div>
          <div class="status-item">
            <span class="s-label">A VENCER</span>
            <span class="s-val s-val--amarelo">⚠️ 0</span>
          </div>
          <div class="status-item">
            <span class="s-label">VENCIDO</span>
            <span class="s-val s-val--vermelho">❌ 0</span>
          </div>
        </div>
        <div class="grafico-barras">
          <h3>4 EPIs mais entregues no ano</h3>
          <canvas id="chartBarras" height="120"></canvas>
        </div>
        <div class="grafico-linha">
          <h3>EPIs entregues durante o ano</h3>
          <canvas id="chartLinha" height="100"></canvas>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
