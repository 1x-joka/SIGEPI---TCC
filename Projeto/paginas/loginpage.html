<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — SIGEPI</title>
  <link rel="stylesheet" href="../estilos/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="../scripts/script.js" defer></script>
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body class="layout-flex">
  <header class="header">
    <div class="logo-wrap">
      <span class="logo-title">SIGEPI</span>
      <span class="logo-sub">Gerenciador de EPI Online</span>
    </div>
    <a href="signuppage.html" class="header-link">Sign Up</a>
  </header>

  <div class="page-center">
    <div class="login-card">
      <h1>Login</h1>
      <div class="form-group form-group--login">
        <label for="email">Email <span class="req">*</span></label>
        <input type="email" placeholder="Exemplo@gmail.com" id="email">
        <span class="error-msg" id="email-error">E-mail ou senha incorretos.</span>
      </div>
      <div class="form-group form-group--login">
        <label for="senha">Senha <span class="req">*</span></label>
        <div class="senha-wrap">
          <input type="password" placeholder="Digite sua senha" id="senha">
          <button type="button" class="btn-olho" onclick="toggleSenha('senha', this)" aria-label="Mostrar senha">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
        <!-- NÃO SOU UM ROBÔ (reCAPTCHA) -->
        <div class="recaptcha-box">
          <div class="g-recaptcha" data-sitekey="6Lc1M1YtAAAAAJNoR1ERc5hnb6dWR3lRo9BKIx5A"></div>
          <span class="error-msg" id="captcha-error">Confirme que você não é um robô.</span>
        </div>
      <span class="error-msg" id="captcha-error">Confirme que você não é um robô.</span>
      </div>
      <button class="btn btn-primary btn-entrar" onclick="fazerLogin()">Entrar</button>
    </div>
  </div>
</body>
</html>
