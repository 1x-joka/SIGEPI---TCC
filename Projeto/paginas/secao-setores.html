<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seção Setores — SIGEPI</title>
  <link rel="stylesheet" href="../estilos/style.css">
   
  <!-- PWA -->
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#3c98bd">
  <link rel="apple-touch-icon" href="../imagens/icone-192.png">
  <!-- PWA -->

  <script src="../scripts/script.js" defer></script>
</head>
<body class="layout-flex">
  <header class="header">
    <div class="logo-wrap">
      <span class="logo-title">SIGEPI</span>
      <span class="logo-sub">Gerenciador de EPI Online</span>
    </div>
    <div class="header-right">
      Administrador
      <div class="avatar-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      </div>
    </div>
  </header>

  <div class="page-center">
    <div class="card-secao card-secao--setores">
      <h1>Seção Setores</h1>
      <div class="setores-table-wrap">
        <table id="tabela-setores">
          <thead>
            <tr>
              <th class="th-left">Nome do Setor</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tbody-setores"></tbody>
        </table>
        <span class="error-msg" id="setor-dup-error">Este setor já está cadastrado.</span>
      </div>
      <div class="add-setor-row">
        <input type="text" id="novo-setor" placeholder="Nome do Novo Setor">
        <button class="btn btn-primary btn-add-setor" onclick="adicionarSetorSecao()">+ Adicionar</button>
      </div>
      <div class="secao-actions secao-actions--mt">
        <button class="btn btn-primary btn-lg" onclick="window.history.back()">Voltar</button>
      </div>
    </div>
  </div>
</body>
</html>
