<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histórico — SIGEPI</title>
  <link rel="stylesheet" href="../estilos/style.css">
  <script src="../scripts/script.js" defer></script>
</head>
<body class="layout-flex" data-protegida>
  <header class="header">
    <div class="logo-wrap">
      <span class="logo-title">SIGEPI</span>
      <span class="logo-sub">Gerenciador de EPI Online</span>
    </div>
    <div class="header-right">
      Administrador
      <div class="avatar-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      </div>
      <div class="dropdown-menu">
        <a href="secao-empresa.html">🏢 Empresa</a>
        <a href="secao-setores.html">🏗️ Setores</a>
      </div>
    </div>
  </header>

  <div class="main-area">
    <div class="content-card">
      <nav class="inner-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="epis.html">EPIs</a>
        <a href="funcionarios.html">Funcionários</a>
        <a href="historico.html" class="active">Histórico</a>
      </nav>

      <div class="historico-body">
        <h2 class="page-title">Histórico</h2>
        <div class="filter-bar">
          <div class="select-wrap select-wrap--filtro-tipo">
            <select id="filtro-tipo" onchange="filtrarHistorico()">
              <option value="">Tipos</option>
              <option>Entrega</option><option>Devolução</option><option>Reposição</option>
              <option>Entrada Estoque</option><option>Retirada Estoque</option>
              <option>Cadastro EPI</option><option>Exclusão EPI</option>
              <option>Cadastro Funcionário</option><option>Exclusão Funcionário</option>
              <option>Solicitação</option><option>Solicitação Aprovada</option>
              <option>Solicitação Recusada</option><option>Cadastro Empresa</option>
            </select>
          </div>
          <div class="select-wrap select-wrap--filtro-setor">
            <select id="filtro-setor" onchange="filtrarHistorico()">
              <option value="">Setor</option>
              <option>Pintura</option><option>Acabamento</option>
              <option>Metalurgia</option><option>Construção</option>
            </select>
          </div>
          <input type="date" id="filtro-inicio" onchange="filtrarHistorico()" class="input-data-filtro">
          <input type="date" id="filtro-fim" onchange="filtrarHistorico()" class="input-data-filtro">
        </div>
        <div class="table-overflow">
          <table id="tabela-hist">
            <thead>
              <tr>
                <th>Data</th><th>Tipo</th><th>Descrição</th><th>Equipamento</th>
                <th>Funcionário</th><th>Setor</th><th>Quantidade</th><th>Responsável</th><th>Motivo</th>
              </tr>
            </thead>
            <tbody id="tbody-hist">
            </tbody>
          </table>
        </div>
        <div class="table-footer">
          <button class="btn btn-primary" onclick="exportarPDF()">Exportar PDF</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
