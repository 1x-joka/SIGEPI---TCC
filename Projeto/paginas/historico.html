<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histórico — SIGEPI</title>
  <link rel="stylesheet" href="../estilos/style.css">
   
  <!-- PWA -->
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#3c98bd">
  <link rel="apple-touch-icon" href="../imagens/icone-192.png">
  <!-- PWA -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="../scripts/script.js" defer></script>
</head>
<body class="layout-flex" data-protegida>
  <header class="header">
    <div class="logo-wrap">
      <span class="logo-title">SIGEPI</span>
      <span class="logo-sub">Gerenciador de EPI Online</span>
    </div>
    <div class="header-right">
      Administrador
      <div class="avatar-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
      </div>
      <div class="dropdown-menu">
        <a href="secao-empresa.html">🏢 Empresa</a>
        <a href="secao-setores.html">🏗️ Setores</a>
      </div>
    </div>
  </header>

  <div class="main-area">
    <div class="content-card">
      <nav class="inner-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="epis.html">EPIs</a>
        <a href="funcionarios.html">Funcionários</a>
        <a href="historico.html" class="active">Histórico</a>
      </nav>

      <div class="historico-body">
        <h2 class="page-title">Histórico</h2>
        <div class="filter-bar">
          <div class="select-wrap select-wrap--filtro-tipo">
            <select id="filtro-tipo" onchange="filtrarHistorico()">
              <option value="">Todos os tipos</option>
              <option value="CADASTRO_EPI">Cadastro de EPI</option>
              <option value="ENTRADA_ESTOQUE">Entrada de Estoque</option>
              <option value="SAIDA_ESTOQUE">Retirada de Estoque</option>
              <option value="ENTREGA">Entrega</option>
              <option value="ENTREGA_CONFIRMADA">Recebimento Confirmado</option>
              <option value="ENTREGA_RECUSADA">Recebimento Recusado</option>
              <option value="DEVOLUCAO">Devolução</option>
              <option value="SOLICITACAO_APROVADA">Solicitação Aprovada</option>
              <option value="SOLICITACAO_RECUSADA">Solicitação Recusada</option>
              <option value="INATIVACAO_FUNC">Inativação de Funcionário</option>
              <option value="INATIVACAO_EPI">Inativação de EPI</option>
              <option value="EDICAO_FUNC">Edição de Funcionário</option>
            </select>
          </div>
          <label class="label-filtro-data" for="filtro-inicio">Filtrar por data:</label>
          <input type="date" id="filtro-inicio" onchange="filtrarHistorico()" class="input-data-filtro">
        </div>
        <div class="table-overflow">
          <table id="tabela-hist">
            <thead>
              <tr>
                <th>Data/Hora</th><th>Tipo</th><th>Equipamento</th><th>Quantidade</th><th>Motivo</th><th>Responsável</th>
              </tr>
            </thead>
            <tbody id="tbody-hist">
            </tbody>
          </table>
        </div>
        <div class="table-footer">
          <button class="btn btn-primary" onclick="exportarPDF()">Exportar PDF</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
