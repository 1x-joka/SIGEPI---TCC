<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esqueci minha senha - SIGEPI</title>
  <link rel="stylesheet" href="../estilos/style.css">
  <link rel="shortcut icon" href="../icons/favicon-capacete.png" type="image/png">

  <!-- PWA -->
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#3c98bd">
  <link rel="apple-touch-icon" href="../imagens/icone-192.png">
  <!-- PWA -->

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="../scripts/script.js" defer></script>
</head>
<body class="layout-flex">
  <header class="header">
    <div class="logo-wrap">
      <span class="logo-title">SIGEPI</span>
      <span class="logo-sub">Gerenciador de EPI Online</span>
    </div>
    <a href="loginpage.html" class="header-link">Login</a>
  </header>

  <div class="page-center">
    <div class="login-card">
      <h1>Esqueci minha senha</h1>
      <p class="texto-ajuda">Informe o e-mail da sua conta. Se ele estiver cadastrado, enviaremos um link para redefinir a senha.</p>
      <div class="form-group form-group--login">
        <label for="email">Email <span class="req">*</span></label>
        <input type="email" placeholder="Exemplo@gmail.com" id="email">
        <span class="error-msg" id="email-error">Informe o e-mail.</span>
      </div>
      <p class="msg-sucesso" id="msg-sucesso"></p>
      <button class="btn btn-primary btn-entrar" onclick="solicitarReset()">Enviar link</button>
    </div>
  </div>
</body>
</html>
